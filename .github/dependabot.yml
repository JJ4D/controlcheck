# Keep dependencies and pinned action SHAs current.
#
# cooldown matches `exclude-newer = "7 days"` in pyproject.toml: neither Dependabot
# nor uv adopts a release until it has been public for a week. Security updates
# are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
