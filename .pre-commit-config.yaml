# Local guardrails. CI runs the same checks, so these are a fast first line of defence.
#
# Remote hooks are pinned to full commit SHAs, never tags: tags are mutable and can be
# force-pushed to malicious code (as happened to aquasecurity/trivy-action in March 2026).
# Update with: pre-commit autoupdate --freeze
#
# ruff and zizmor run through `uv run`, so hooks use exactly the versions in uv.lock and
# cannot drift from CI.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: zizmor
        name: zizmor (GitHub Actions security lint)
        entry: uv run --locked zizmor
        language: system
        files: ^\.github/
        types: [yaml]
